<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ميثاق للتهيئة الزوجية (Copy) (Copy)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ===================================================================
   DESIGN PLAN
   Layout: a single travelled "charter" — fixed slim top bar (overall
   progress as a filling line), a centered column of cards the user
   moves through screen by screen, and a 13-medallion map between
   chapters. The certificate closes the journey as an ornamented
   charter page with a drawn geometric border.
   Color:  --bg --surface --surface-2 --fg --muted --border --accent
           --accent-strong --gold --gold-soft --danger --danger-bg
           --success --success-bg
   Type:   --font-display (Aref Ruqaa, headings + certificate)
           --font-body    (IBM Plex Sans Arabic, everything else)
   =================================================================== */
:root{
  --bg:#F2EDDE; --surface:#FFFCF5; --surface-2:#E8DFC4; --fg:#20352F;
  --muted:#5C6B61; --border:#D7C89C; --accent:#1F6F5C; --accent-strong:#113E33;
  --gold:#9C7A2C; --gold-soft:#E2D2A0; --danger:#8B3A2B; --danger-bg:#F3E1D6;
  --success:#2E6B4F; --success-bg:#E2EEE0; --shadow:0 1px 2px rgba(32,40,30,.06),0 6px 20px -8px rgba(32,40,30,.18);
  --font-display:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif; --font-body:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14201B; --surface:#1B2B24; --surface-2:#24362C; --fg:#ECE6D4;
    --muted:#A6B3A8; --border:#3A4D40; --accent:#4FBE9B; --accent-strong:#86DCBB;
    --gold:#D8BA66; --gold-soft:#5B4A24; --danger:#E6977C; --danger-bg:#3A251E;
    --success:#86D1A6; --success-bg:#1F342A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14201B; --surface:#1B2B24; --surface-2:#24362C; --fg:#ECE6D4;
  --muted:#A6B3A8; --border:#3A4D40; --accent:#4FBE9B; --accent-strong:#86DCBB;
  --gold:#D8BA66; --gold-soft:#5B4A24; --danger:#E6977C; --danger-bg:#3A251E;
  --success:#86D1A6; --success-bg:#1F342A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); direction:rtl; font-family:var(--font-body); line-height:1.75; -webkit-font-smoothing:antialiased;}
html,body{height:100%}
h1,h2,h3,.disp{font-family:var(--font-body); font-weight:700;}
::selection{background:var(--gold-soft)}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
a{color:var(--accent-strong)}
button{font-family:inherit}

#app{min-height:100%; display:flex; flex-direction:column;}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--border);}
.topbar-inner{max-width:760px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px;}
.brand{font-family:var(--font-body); font-size:1.15rem; color:var(--accent-strong); white-space:nowrap;}
.topbar-track{flex:1; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.topbar-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:4px; transition:width .5s ease;}
.topbar-pct{font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
.map-btn{border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:8px; padding:6px 10px; font-size:.78rem; cursor:pointer;}
.map-btn:hover{border-color:var(--accent)}

/* ---------- shell / screens ---------- */
.wrap{max-width:760px; margin:0 auto; width:100%; padding-inline:18px; padding-block:28px; flex:1; display:flex; flex-direction:column; gap:18px;}
.screen{display:flex; flex-direction:column; gap:18px; animation:rise .35s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 22px; box-shadow:var(--shadow);}
.card + .card{margin-top:0}
.eyebrow{font-size:.78rem; letter-spacing:.04em; color:var(--gold); text-transform:none; font-weight:600;}
.h-title{font-size:1.5rem; margin:4px 0 2px; text-wrap:balance;}
.h-sub{color:var(--muted); font-size:.95rem; margin:0 0 6px;}
.lede{font-size:1.02rem; max-width:65ch;}
.p{margin:0 0 10px; max-width:66ch;}
.p:last-child{margin-bottom:0}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:11px; padding:13px 20px; font-size:.98rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:transform .12s ease, filter .15s ease;}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.45; cursor:not-allowed;}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--fg);}
.btn-ghost:hover{border-color:var(--accent)}
.btn-gold{background:var(--gold); color:#2b2310;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.btn-block{width:100%}

/* ---------- intro ---------- */
.intro-badge{width:58px; height:58px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-size:1.6rem; color:var(--accent-strong);}
.tagline{color:var(--gold); font-weight:600; letter-spacing:.03em;}
.disclaimer-box{background:var(--surface-2); border:1px dashed var(--border); border-radius:12px; padding:14px 16px; font-size:.88rem; color:var(--muted);}

/* ---------- registration ---------- */
.field{display:flex; flex-direction:column; gap:7px;}
.field label{font-size:.88rem; font-weight:600;}
.field input[type=text]{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; font-size:1rem; color:var(--fg); font-family:inherit;}
.field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.choice-grid{display:flex; flex-wrap:wrap; gap:8px;}
.choice-chip{border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:999px; padding:9px 16px; font-size:.88rem; cursor:pointer;}
.choice-chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent);}
.optional-toggle{background:none; border:none; color:var(--accent-strong); font-weight:600; font-size:.88rem; cursor:pointer; padding:4px 0; text-align:right; display:flex; align-items:center; gap:6px;}
.optional-body{display:flex; flex-direction:column; gap:14px; padding-top:6px;}
.optional-body[hidden]{display:none}

/* ---------- chapter map ---------- */
.medallion-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.medallion{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:16px 10px; border-radius:14px; border:1px solid var(--border); background:var(--surface); cursor:pointer; min-width:0;}
.medallion:disabled{cursor:not-allowed; opacity:.55;}
.medallion[data-state="current"]{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
.medallion[data-state="done"]{border-color:var(--gold);}
.med-num{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-size:1.15rem; background:var(--surface-2); color:var(--fg); font-variant-numeric:tabular-nums;}
.medallion[data-state="done"] .med-num{background:var(--gold); color:#2b2310;}
.medallion[data-state="current"] .med-num{background:var(--accent); color:#fff;}
.med-title{font-size:.8rem; font-weight:600; line-height:1.4; max-width:100%;}
.med-badge{font-size:.68rem; color:var(--muted);}
.med-badge.ok{color:var(--success)}
.med-badge.warn{color:var(--danger)}

/* ---------- reading / story ---------- */
.dots{display:flex; gap:6px; justify-content:center;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent); width:18px; border-radius:4px; transition:width .2s;}
.story-kicker{display:flex; align-items:center; gap:8px; color:var(--gold); font-weight:700; font-size:.85rem;}

/* ---------- quiz ---------- */
.q-text{font-size:1.08rem; font-weight:600; margin:0;}
.choice-btn{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:right; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:.95rem; cursor:pointer; color:var(--fg);}
.choice-btn:hover:not(:disabled){border-color:var(--accent)}
.choice-btn .mark{flex:0 0 22px; width:22px; height:22px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; margin-top:1px;}
.choice-btn[data-mark="correct"]{border-color:var(--success); background:var(--success-bg);}
.choice-btn[data-mark="correct"] .mark{background:var(--success); color:#fff; border-color:var(--success);}
.choice-btn[data-mark="wrong"]{border-color:var(--danger); background:var(--danger-bg);}
.choice-btn[data-mark="wrong"] .mark{background:var(--danger); color:#fff; border-color:var(--danger);}
.choice-btn:disabled{cursor:default;}
.feedback{border-radius:12px; padding:14px 16px; font-size:.92rem; display:flex; gap:10px; align-items:flex-start;}
.feedback.ok{background:var(--success-bg); color:var(--fg);}
.feedback.bad{background:var(--danger-bg); color:var(--fg);}
.feedback b{font-family:var(--font-body); font-weight:700;}
.quiz-progress{font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums;}

/* ---------- safety ---------- */
.safety-banner{border:1px solid var(--danger); background:var(--danger-bg); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
.safety-banner h3{margin:0; font-size:1.05rem; color:var(--danger);}
.safety-banner ul{margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:4px; font-size:.9rem;}
.safety-banner .foot{font-size:.78rem; color:var(--muted);}

/* ---------- reflection / plan ---------- */
.scale-row{display:flex; flex-direction:column; gap:10px;}
.scale-stmt{font-size:.96rem; font-weight:600;}
.scale-opts{display:flex; gap:7px; flex-wrap:wrap;}
.scale-opt{flex:1; min-width:70px; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 6px; font-size:.78rem; text-align:center; cursor:pointer; color:var(--fg);}
.scale-opt[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent);}
.plan-topic{font-size:.78rem; color:var(--gold); font-weight:700;}
.plan-option{display:block; width:100%; text-align:right; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px; font-size:.92rem; cursor:pointer; margin-top:8px; color:var(--fg);}
.plan-option[aria-pressed="true"]{border-color:var(--accent); background:var(--success-bg);}

/* ---------- key messages / summary ---------- */
.quote{border-right:3px solid var(--gold); padding-right:14px; font-size:1.02rem; font-family:var(--font-body); color:var(--accent-strong);}
.quote + .quote{margin-top:10px}
.rubric-pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 14px; font-size:.82rem; font-weight:600;}
.rubric-pill.strength{background:var(--success-bg); color:var(--success);}
.rubric-pill.growth{background:var(--gold-soft); color:#5b4718;}
.rubric-pill.clarity{background:var(--danger-bg); color:var(--danger);}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .rubric-pill.growth{color:var(--gold)} }
:root[data-theme="dark"] .rubric-pill.growth{color:var(--gold)}

/* ---------- completion / certificate ---------- */
.summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-tile{background:var(--surface-2); border-radius:12px; padding:14px; text-align:center;}
.stat-num{font-family:var(--font-body); font-size:1.8rem; color:var(--accent-strong); font-variant-numeric:tabular-nums;}
.stat-lbl{font-size:.76rem; color:var(--muted);}

.cert-frame{position:relative; background:var(--surface); border-radius:4px; padding:34px 28px; overflow:hidden;}
.cert-border{position:absolute; inset:10px; border:2px solid var(--gold); border-radius:2px; pointer-events:none;}
.cert-border::before, .cert-border::after{content:""; position:absolute; width:22px; height:22px; border:2px solid var(--gold);}
.cert-border::before{top:-2px; right:-2px; border-width:2px 2px 0 0;}
.cert-border::after{bottom:-2px; left:-2px; border-width:0 0 2px 2px;}
.cert-inner{position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;}
.cert-eyebrow{font-size:.8rem; color:var(--gold); letter-spacing:.06em; font-weight:700;}
.cert-title{font-size:2.1rem; margin:0; color:var(--accent-strong);}
.cert-sub{font-size:.95rem; color:var(--muted); margin-top:-4px;}
.cert-name{font-size:1.7rem; margin:10px 0 0; border-bottom:2px solid var(--gold-soft); padding-bottom:6px; display:inline-block;}
.cert-body{max-width:46ch; font-size:.95rem; color:var(--fg);}
.cert-meta{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums;}
.cert-tagline{font-family:var(--font-body); font-size:1.1rem; color:var(--gold); letter-spacing:.05em;}
.cert-disclaimer{font-size:.76rem; color:var(--muted); max-width:50ch;}
.copy-row{display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap;}
.copy-chip{font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; background:var(--surface-2); border-radius:8px; padding:5px 10px; font-size:.82rem;}
.print-hint{font-size:.84rem; color:var(--muted); background:var(--surface-2); border-radius:10px; padding:12px 14px;}

footer.foot-note{text-align:center; color:var(--muted); font-size:.76rem; padding:10px 0 20px;}

@media print{
  .topbar, .no-print{display:none !important;}
  body{background:#fff;}
  .cert-frame{box-shadow:none; border:none;}
}
@media (max-width:480px){
  .cert-title{font-size:1.6rem}
  .summary-grid{grid-template-columns:1fr 1fr}
}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- */
/* state                                                             */
/* ---------------------------------------------------------------- */
var STORE_KEY = "mithaq_journey_v1";
var CONTENT = null;

function freshState(){
  return {
    registered:false,
    registration:{},
    route:{name:"intro"},
    chapters:{},           // id -> per-chapter progress
    certificateId:null,
    startedAt:null,
    completedAt:null
  };
}
function freshChapterState(){
  return {
    status:"locked",            // locked | available | done
    stage:"story",              // story | reading | quiz | remedial | reflection | plan | summary
    readingIdx:0,
    quizIdx:0,
    quizOrder:[],                // indices of questions still to ask this round
    answered:{},                 // qIndex -> chosenIndex
    wrongOnce:{},                 // qIndex -> true if missed on the very first pass
    firstPassScore:null,
    reflectionAns:[],
    planAns:[],
    dangerFlagged:false
  };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return freshState();
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return freshState();
    return parsed;
  }catch(e){ return freshState(); }
}
var state = loadState();
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
function nav(route){ state.route = route; saveState(); render(); window.scrollTo(0,0); }

/* ---------------------------------------------------------------- */
/* helpers                                                            */
/* ---------------------------------------------------------------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(elm, ev, fn){ if(elm) elm.addEventListener(ev, fn); }
function chapterById(id){ return CONTENT.chapters.find(function(c){return c.id===id;}); }
function chState(id){
  if(!state.chapters[id]) state.chapters[id] = freshChapterState();
  return state.chapters[id];
}
function totalChapters(){ return CONTENT.chapters.length; }
function completedCount(){
  return CONTENT.chapters.filter(function(c){ return chState(c.id).status==="done"; }).length;
}
function overallPct(){ return Math.round((completedCount()/totalChapters())*100); }
function isUnlocked(id){
  if(id===1) return true;
  var prev = chState(id-1);
  return prev.status==="done";
}
function syncLocks(){
  CONTENT.chapters.forEach(function(c){
    var cs = chState(c.id);
    if(cs.status==="done") return;
    cs.status = isUnlocked(c.id) ? "available" : "locked";
  });
}
function shuffleCopy(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function genCertId(){
  var n = "";
  for(var i=0;i<6;i++) n += Math.floor(Math.random()*10);
  return CONTENT.meta.certificate.idPrefix + "-" + n;
}
function fmtDate(iso){
  try{
    var d = new Date(iso);
    return d.toLocaleDateString("ar-SA", {year:"numeric", month:"long", day:"numeric"});
  }catch(e){ return ""; }
}
function addressHonorific(){
  var g = state.registration.gender;
  if(g==="امرأة") return "أختي الكريمة";
  if(g==="رجل") return "أخي الكريم";
  return "صاحب الميثاق";
}

/* ---------------------------------------------------------------- */
/* top bar                                                           */
/* ---------------------------------------------------------------- */
function renderTopbar(){
  var showMap = state.registered && state.route.name!=="intro" && state.route.name!=="register";
  return (
    '<div class="topbar"><div class="topbar-inner">'+
      '<span class="brand">ميثاق</span>'+
      (state.registered ? '<div class="topbar-track" role="progressbar" aria-valuenow="'+overallPct()+'" aria-valuemin="0" aria-valuemax="100"><div class="topbar-fill" style="width:'+overallPct()+'%"></div></div><span class="topbar-pct">'+overallPct()+'%</span>' : '<div style="flex:1"></div>')+
      (showMap ? '<button class="map-btn" id="btn-map" type="button">الخريطة</button>' : '')+
    '</div></div>'
  );
}

/* ---------------------------------------------------------------- */
/* SCREEN: intro                                                     */
/* ---------------------------------------------------------------- */
function screenIntro(){
  var m = CONTENT.meta;
  return (
    '<div class="screen">'+
      '<div class="card" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;">'+
        '<div class="intro-badge">م</div>'+
        '<h1 class="h-title disp" style="font-size:2.1rem;">'+esc(m.programTitle)+'</h1>'+
        '<div class="tagline">'+esc(m.tagline)+'</div>'+
        '<p class="h-sub" style="margin-top:4px;">'+esc(m.programSubtitle)+'</p>'+
      '</div>'+
      '<div class="card"><p class="p lede">'+esc(m.intro.summary)+'</p></div>'+
      '<div class="disclaimer-box">'+esc(m.intro.disclaimer)+'</div>'+
      '<button class="btn btn-primary btn-block" id="btn-start" type="button">ابدأ الرحلة</button>'+
    '</div>'
  );
}

/* ---------------------------------------------------------------- */
/* SCREEN: registration                                              */
/* ---------------------------------------------------------------- */
function screenRegister(){
  var reg = CONTENT.meta.registration;
  var data = state.registration;
  function chipGroup(field){
    return '<div class="choice-grid" data-field="'+field.key+'">' +
      field.options.map(function(opt){
        var pressed = data[field.key]===opt;
        return '<button type="button" class="choice-chip" aria-pressed="'+pressed+'" data-value="'+esc(opt)+'">'+esc(opt)+'</button>';
      }).join("") + '</div>';
  }
  var requiredHtml = reg.required.map(function(f){
    if(f.type==="text"){
      return '<div class="field"><label for="f-'+f.key+'">'+esc(f.label)+'</label>'+
        '<input type="text" id="f-'+f.key+'" data-field="'+f.key+'" placeholder="'+esc(f.placeholder||"")+'" value="'+esc(data[f.key]||"")+'"></div>';
    }
    return '<div class="field"><label>'+esc(f.label)+'</label>'+chipGroup(f)+'</div>';
  }).join("");
  var optionalHtml = reg.optional.map(function(f){
    return '<div class="field"><label>'+esc(f.label)+'</label>'+chipGroup(f)+'</div>';
  }).join("");

  return (
    '<div class="screen">'+
      '<div class="card">'+
        '<div class="eyebrow">قبل أن تبدأ</div>'+
        '<h2 class="h-title">بياناتك الأساسية</h2>'+
        '<p class="h-sub">معلومات مختصرة تُستخدم لتخصيص خطابك وشهادتك، وتبقى محفوظة في متصفحك فقط على هذا الجهاز.</p>'+
        '<div style="display:flex; flex-direction:column; gap:16px; margin-top:6px;">'+requiredHtml+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<button type="button" class="optional-toggle" id="btn-optional" aria-expanded="'+!!state._optOpen+'">'+
          '<span>'+ (state._optOpen? "▲":"▼") +'</span> تفاصيل إضافية (اختياري)'+
        '</button>'+
        '<div class="optional-body" id="optional-body" '+(state._optOpen?'':'hidden')+'>'+optionalHtml+'</div>'+
      '</div>'+

    '</div>'
  );
}

/* ---------------------------------------------------------------- */
/* SCREEN: chapter map                                                */
/* ---------------------------------------------------------------- */
function screenMap(){
  syncLocks();
  var items = CONTENT.chapters.map(function(c){
    var cs = chState(c.id);
    var state_ = cs.status; // locked|available|done
    var disabled = state_==="locked";
    var badge = "";
    if(state_==="done"){
      if(c.isSafetyChapter) badge = '<span class="med-badge ok">اكتمل</span>';
      else if(c.isFinalChapter) badge = '<span class="med-badge ok">اكتملت الخطة</span>';
      else{
        var pct = Math.round((cs.firstPassScore||0)*100);
        badge = '<span class="med-badge '+(pct>=80?"ok":(pct>=50?"":"warn"))+'">'+pct+'%</span>';
      }
    } else if(state_==="available"){
      badge = '<span class="med-badge">متاح</span>';
    } else {
      badge = '<span class="med-badge">مقفل</span>';
    }
    var visState = state_==="done" ? "done" : (state_==="available" ? "current" : "locked");
    return '<button type="button" class="medallion" data-ch="'+c.id+'" data-state="'+visState+'" '+(disabled?"disabled":"")+'>'+
      '<span class="med-num">'+(state_==="done"?"✓":c.id)+'</span>'+
      '<span class="med-title">'+esc(c.title)+'</span>'+
      badge+
    '</button>';
  }).join("");

  var allDone = completedCount()===totalChapters();

  return (
    '<div class="screen">'+
      '<div class="card">'+
        '<div class="eyebrow">مرحبًا، '+esc(addressHonorific())+'</div>'+
        '<h2 class="h-title">خريطة البرنامج</h2>'+
        '<p class="h-sub">ثلاثة عشر فصلًا، كل فصل يُفتح بعد إكمال الذي قبله. '+completedCount()+' من '+totalChapters()+' مكتمل.</p>'+
      '</div>'+
      '<div class="medallion-grid">'+items+'</div>'+
      (allDone ? '<button class="btn btn-gold btn-block" id="btn-goto-completion" type="button">عرض ملخص الإتمام والشهادة</button>' : '')+
    '</div>'
  );
}

/* ---------------------------------------------------------------- */
/* chapter flow                                                      */
/* ---------------------------------------------------------------- */
function screenChapter(chId){
  var c = chapterById(chId);
  var cs = chState(chId);
  if(cs.status==="locked"){ return screenMap(); }

  switch(cs.stage){
    case "story": return chapterStory(c, cs);
    case "reading": return chapterReading(c, cs);
    case "quiz": return chapterQuiz(c, cs, false);
    case "remedial": return chapterQuiz(c, cs, true);
    case "reflection": return chapterReflection(c, cs);
    case "plan": return chapterPlan(c, cs);
    case "summary": return chapterSummary(c, cs);
    default: cs.stage="story"; return chapterStory(c, cs);
  }
}

function chapterHeader(c, label){
  return '<div class="eyebrow">الفصل '+c.id+' من '+totalChapters()+' · '+esc(label)+'</div>'+
         '<h2 class="h-title">'+esc(c.title)+'</h2>'+
         '<p class="h-sub">'+esc(c.purpose)+'</p>';
}

function chapterStory(c, cs){
  return (
    '<div class="screen">'+
      '<div class="card">'+chapterHeader(c,"القصة الافتتاحية")+
        '<div class="story-kicker">✦ موقف من الحياة</div>'+
        c.story.map(function(p){ return '<p class="p">'+esc(p)+'</p>'; }).join("")+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" id="btn-back-map" type="button">الخريطة</button>'+
        '<button class="btn btn-primary" id="btn-story-next" type="button" style="flex:1">المادة العلمية والشرعية</button>'+
      '</div>'+
    '</div>'
  );
}

function chapterReading(c, cs){
  var n = c.reading.length;
  var i = Math.min(cs.readingIdx, n-1);
  var card = c.reading[i];
  var dots = c.reading.map(function(_,idx){ return '<span class="dot '+(idx===i?"active":"")+'"></span>'; }).join("");
  var isLast = i===n-1;
  return (
    '<div class="screen">'+
      '<div class="card">'+chapterHeader(c,"القراءة ("+(i+1)+"/"+n+")")+
        '<h3 style="margin:10px 0 4px; font-size:1.1rem;">'+esc(card.heading)+'</h3>'+
        card.paragraphs.map(function(p){ return '<p class="p">'+esc(p)+'</p>'; }).join("")+
      '</div>'+
      '<div class="dots">'+dots+'</div>'+
      '<div class="btn-row">'+
        (i>0 ? '<button class="btn btn-ghost" id="btn-read-prev" type="button">السابق</button>' : '<button class="btn btn-ghost" id="btn-back-map" type="button">الخريطة</button>')+
        '<button class="btn btn-primary" id="btn-read-next" type="button" style="flex:1">'+(isLast? "ابدأ الأسئلة" : "التالي")+'</button>'+
      '</div>'+
    '</div>'
  );
}

function currentQuizList(c, cs, remedial){
  if(!remedial) return c.quiz.map(function(_,idx){return idx;});
  return Object.keys(cs.wrongOnce).filter(function(k){return cs.wrongOnce[k];}).map(Number);
}

function chapterQuiz(c, cs, remedial){
  if(!cs.quizOrder || !cs.quizOrder.length){
    cs.quizOrder = remedial ? currentQuizList(c,cs,true) : c.quiz.map(function(_,idx){return idx;});
    cs.quizIdx = 0;
    // clear any previous answer for this round's questions so they can be answered fresh
    // (matters for remedial rounds, which re-ask previously missed questions)
    cs.quizOrder.forEach(function(idx){ delete cs.answered[idx]; });
  }
  if(cs.quizIdx >= cs.quizOrder.length){
    // round finished
    if(remedial){
      var stillWrong = Object.keys(cs.wrongOnce).filter(function(k){return cs.wrongOnce[k];});
      if(stillWrong.length===0){ cs.stage = c.isFinalChapter ? "plan" : "reflection"; cs.quizOrder=[]; }
      else { cs.quizOrder=[]; /* will rebuild remedial list */ }
    } else {
      var total = c.quiz.length;
      var wrongCount = Object.keys(cs.wrongOnce).length;
      cs.firstPassScore = (total-wrongCount)/total;
      if(cs.firstPassScore >= CONTENT.meta.masteryThreshold || wrongCount===0){
        cs.stage = c.isFinalChapter ? "plan" : "reflection";
      } else {
        cs.stage = "remedial";
      }
      cs.quizOrder=[];
    }
    saveState();
    return screenChapter(c.id);
  }

  var qIndex = cs.quizOrder[cs.quizIdx];
  var q = c.quiz[qIndex];
  var chosen = cs.answered[qIndex];
  var answered = chosen!==undefined;
  var isDangerWrong = answered && q.danger && chosen!==q.correct;

  var choicesHtml = q.choices.map(function(choice,idx){
    var mark = "";
    if(answered){
      if(idx===q.correct) mark = "correct";
      else if(idx===chosen) mark = "wrong";
    }
    var markGlyph = mark==="correct" ? "✓" : (mark==="wrong" ? "✕" : (idx+1));
    return '<button type="button" class="choice-btn" data-idx="'+idx+'" '+(answered?"disabled":"")+' '+(mark?'data-mark="'+mark+'"':"")+'>'+
      '<span class="mark">'+markGlyph+'</span><span>'+esc(choice)+'</span>'+
    '</button>';
  }).join("");

  var feedback = "";
  if(answered){
    var correct = chosen===q.correct;
    feedback = '<div class="feedback '+(correct?"ok":"bad")+'">'+
      '<span>'+(correct?"✓":"✕")+'</span>'+
      '<span><b>'+(correct?"صحيحة. ":"غير دقيقة. ")+'</b>'+esc(q.explain)+'</span>'+
    '</div>';
    if(isDangerWrong){
      feedback += renderSafetyBanner(true);
    }
  }

  var progressLabel = remedial ? "مراجعة مركّزة: سؤال "+(cs.quizIdx+1)+" من "+cs.quizOrder.length
                                : "سؤال "+(cs.quizIdx+1)+" من "+cs.quizOrder.length;

  return (
    '<div class="screen">'+
      (c.isSafetyChapter ? renderSafetyBanner(false) : '')+
      '<div class="card">'+
        '<div class="eyebrow">الفصل '+c.id+' · '+(remedial?"مراجعة مركّزة":"اختبار الفهم")+'</div>'+
        '<div class="quiz-progress">'+progressLabel+'</div>'+
        '<p class="q-text">'+esc(q.q)+'</p>'+
        '<div style="display:flex; flex-direction:column; gap:9px; margin-top:12px;">'+choicesHtml+'</div>'+
        (feedback? '<div style="margin-top:14px">'+feedback+'</div>' : '')+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" id="btn-quiz-prev" type="button" '+(cs.quizIdx===0?'disabled':'')+'>رجوع</button>'+
        '<button class="btn '+(answered?'btn-primary':'btn-ghost')+'" id="btn-quiz-next" type="button" style="flex:1" '+(answered?'':'disabled')+'>'+(cs.quizIdx+1>=cs.quizOrder.length?"استمر":"التالي")+'</button>'+
      '</div>'+
    '</div>'
  );
}

function renderSafetyBanner(isAlert){
  var s = CONTENT.meta.safetyHotline;
  var sc = chapterById(12).safetyNotice;
  return '<div class="safety-banner">'+
    '<h3>'+(isAlert?"ملاحظة مهمة قبل الاستمرار":esc(sc.title))+'</h3>'+
    '<p style="margin:0; font-size:.9rem;">'+esc(sc.body)+'</p>'+
    '<ul>'+ sc.points.map(function(p){return '<li>'+esc(p)+'</li>';}).join("") +'</ul>'+
    '<div class="foot">'+esc(sc.footer)+'</div>'+
  '</div>';
}

function chapterReflection(c, cs){
  if(!cs.reflectionAns || cs.reflectionAns.length!==c.reflection.length){
    cs.reflectionAns = c.reflection.map(function(){return null;});
  }
  var scaleLabels = ["لا ينطبق عليّ", "ينطبق قليلًا", "ينطبق غالبًا", "ينطبق عليّ تمامًا"];
  var rows = c.reflection.map(function(stmt, idx){
    var val = cs.reflectionAns[idx];
    var opts = scaleLabels.map(function(lbl, oi){
      return '<button type="button" class="scale-opt" data-stmt="'+idx+'" data-val="'+oi+'" aria-pressed="'+(val===oi)+'">'+esc(lbl)+'</button>';
    }).join("");
    return '<div class="scale-row"><div class="scale-stmt">'+esc(stmt)+'</div><div class="scale-opts">'+opts+'</div></div>';
  }).join('<hr style="border:none;border-top:1px solid var(--border); margin:4px 0;">');

  var allAnswered = cs.reflectionAns.every(function(v){return v!==null;});

  return (
    '<div class="screen">'+
      '<div class="card">'+
        '<div class="eyebrow">تمرين تأملي · غير مُحتسب</div>'+
        '<h2 class="h-title">قبل أن نغلق الفصل</h2>'+
        '<p class="h-sub">لا توجد إجابة صحيحة أو خاطئة هنا؛ هذا فقط لمساعدتك على التفكير.</p>'+
        '<div style="display:flex; flex-direction:column; gap:16px; margin-top:8px;">'+rows+'</div>'+
      '</div>'+
      '<button class="btn btn-primary btn-block" id="btn-reflection-continue" type="button" '+(allAnswered?'':'disabled')+'>خلاصة الفصل</button>'+
    '</div>'
  );
}

function chapterPlan(c, cs){
  if(!cs.planAns || cs.planAns.length!==c.plan.length){
    cs.planAns = c.plan.map(function(){return null;});
  }
  var items = c.plan.map(function(item, idx){
    var chosen = cs.planAns[idx];
    var opts = item.options.map(function(opt, oi){
      return '<button type="button" class="plan-option" data-topic="'+idx+'" data-opt="'+oi+'" aria-pressed="'+(chosen===oi)+'">'+esc(opt)+'</button>';
    }).join("");
    return '<div class="card"><div class="plan-topic">'+esc(item.topic)+'</div><p class="p" style="font-weight:600; margin-top:4px;">'+esc(item.prompt)+'</p>'+opts+'</div>';
  }).join("");

  var allChosen = cs.planAns.every(function(v){return v!==null;});

  return (
    '<div class="screen">'+
      '<div class="card">'+
        '<div class="eyebrow">خطتنا للحياة الزوجية</div>'+
        '<h2 class="h-title">اختر الأقرب إلى تصورك في كل محور</h2>'+
        '<p class="h-sub">هذه الاختيارات تتحول إلى ملخص خطتك الشخصية في نهاية البرنامج، ويمكنك مراجعتها لاحقًا.</p>'+
      '</div>'+
      items+
      '<button class="btn btn-primary btn-block" id="btn-plan-continue" type="button" '+(allChosen?'':'disabled')+'>خلاصة الفصل</button>'+
    '</div>'
  );
}

function chapterSummary(c, cs){
  cs.status = "done";
  saveState();
  var rubric = null;
  if(!c.isSafetyChapter && !c.isFinalChapter && cs.firstPassScore!=null){
    var r = CONTENT.meta.feedbackRubric;
    if(cs.firstPassScore >= r[0].min) rubric = r[0];
    else if(cs.firstPassScore >= r[1].min) rubric = r[1];
    else rubric = r[2];
  }
  var nextId = c.id+1;
  var hasNext = nextId <= totalChapters();

  return (
    '<div class="screen">'+
      '<div class="card">'+
        '<div class="eyebrow">خلاصة الفصل '+c.id+'</div>'+
        '<h2 class="h-title">'+esc(c.title)+'</h2>'+
        (rubric ? '<span class="rubric-pill '+rubric.key+'">'+esc(rubric.label)+'</span><p class="h-sub" style="margin-top:8px;">'+esc(rubric.desc)+'</p>' : '')+
        '<div style="margin-top:14px; display:flex; flex-direction:column; gap:6px;">'+
          c.keyMessages.map(function(m){ return '<div class="quote">'+esc(m)+'</div>'; }).join("")+
        '</div>'+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" id="btn-back-map" type="button">الخريطة</button>'+
        (hasNext ? '<button class="btn btn-primary" id="btn-next-chapter" data-next="'+nextId+'" type="button" style="flex:1">الفصل التالي</button>'
                 : '<button class="btn btn-gold" id="btn-goto-completion" type="button" style="flex:1">عرض ملخص الإتمام والشهادة</button>')+
      '</div>'+
    '</div>'
  );
}

/* ---------------------------------------------------------------- */
/* SCREEN: completion + certificate                                  */
/* ---------------------------------------------------------------- */
function collectCompletionData(){
  var weak = [];
  var strong = [];
  var anyDanger = false;
  CONTENT.chapters.forEach(function(c){
    var cs = chState(c.id);
    if(c.isSafetyChapter){ if(cs.dangerFlaggedEver) anyDanger = true; return; }
    if(c.isFinalChapter) return;
    if(cs.firstPassScore!=null){
      if(cs.firstPassScore < 0.8) weak.push(c.title);
      else strong.push(c.title);
    }
  });
  var planChapter = chapterById(13);
  var planCs = chState(13);
  var planSummary = planChapter.plan.map(function(item, idx){
    var choice = planCs.planAns && planCs.planAns[idx];
    return {topic:item.topic, text: choice!=null ? item.options[choice] : null};
  });
  return {weak:weak, strong:strong, anyDanger:anyDanger, planSummary:planSummary};
}

function screenCompletion(){
  var data = collectCompletionData();
  if(!state.completedAt) state.completedAt = new Date().toISOString();
  if(!state.certificateId) state.certificateId = genCertId();
  saveState();

  return (
    '<div class="screen">'+
      '<div class="card" style="text-align:center;">'+
        '<div class="eyebrow">تم بحمد الله</div>'+
        '<h2 class="h-title">ملخص إتمام ميثاق</h2>'+
        '<p class="h-sub">'+esc(addressHonorific())+'، أكملت الفصول الثلاثة عشر. هذا ملخصك قبل الشهادة.</p>'+
      '</div>'+
      '<div class="summary-grid">'+
        '<div class="stat-tile"><div class="stat-num">13/13</div><div class="stat-lbl">فصول مكتملة</div></div>'+
        '<div class="stat-tile"><div class="stat-num">'+data.strong.length+'</div><div class="stat-lbl">مواضيع قوة</div></div>'+
      '</div>'+
      (data.weak.length ? '<div class="card"><h3 style="margin-top:0; font-size:1rem;">مواضيع تستحق نقاشًا إضافيًا</h3>'+
        '<p class="h-sub">أداؤك الأول في هذه الفصول كان أقل من 80%، ويُنصح بمراجعتها مع شريك حياتك:</p>'+
        '<div class="btn-row">'+data.weak.map(function(t){return '<span class="rubric-pill clarity">'+esc(t)+'</span>';}).join("")+'</div></div>' : '')+
      (data.anyDanger ? ('<div class="safety-banner"><h3>مسار الأمان متاح لك دائمًا</h3><p style="margin:0;font-size:.9rem;">لاحظنا في فصل العلامات الخطرة إجابات تستدعي مزيدًا من الانتباه. تذكّر أن طلب المساعدة ليس ضعفًا.</p>'+
        '<ul><li>'+esc(CONTENT.meta.safetyHotline.emergency)+'</li><li>'+esc(CONTENT.meta.safetyHotline.familyProtection)+'</li></ul></div>') : '')+
      '<div class="card">'+
        '<h3 style="margin-top:0; font-size:1rem;">خطتنا للحياة الزوجية</h3>'+
        '<div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">'+

            return '<div><div class="plan-topic">'+esc(p.topic)+'</div><div class="p" style="margin-top:2px;">'+esc(p.text||"—")+'</div></div>';
          }).join("")+
        '</div>'+
      '</div>'+
      '<button class="btn btn-gold btn-block" id="btn-goto-cert" type="button">عرض شهادة الإتمام</button>'+
    '</div>'
  );
}

/* ---------------------------------------------------------------- */
/* main render + event wiring                                        */
/* ---------------------------------------------------------------- */
function render(){
  var app = qs("#app");
  var body = "";
  switch(state.route.name){
    case "intro": body = screenIntro(); break;
    case "register": body = screenRegister(); break;
    case "map": body = screenMap(); break;
    case "chapter": body = screenChapter(state.route.chId); break;
    case "completion": body = screenCompletion(); break;
    case "certificate": body = screenCertificate(); break;
    default: body = screenIntro();
  }
  app.innerHTML = renderTopbar() + '<div class="wrap">' + body + '<footer class="foot-note">ميثاق · '+esc(CONTENT.meta.programSubtitle)+'</footer></div>';
  wire();
}

function wire(){
  on(qs("#btn-map"), "click", function(){ nav({name:"map"}); });
  on(qs("#btn-start"), "click", function(){ nav(state.registered ? {name:"map"} : {name:"register"}); });

  // registration
  qsa('[data-field]').forEach(function(group){
    if(group.tagName==="INPUT"){
      on(group, "input", function(){ state.registration[group.getAttribute("data-field")] = group.value; saveState(); });
      return;
    }
    qsa(".choice-chip", group).forEach(function(chip){
      on(chip, "click", function(){
        state.registration[group.getAttribute("data-field")] = chip.getAttribute("data-value");
        saveState(); render();
      });
    });
  });
  on(qs("#btn-optional"), "click", function(){ state._optOpen = !state._optOpen; render(); });
  on(qs("#btn-register-continue"), "click", function(){
    var req = CONTENT.meta.registration.required;
    var missing = req.filter(function(f){ return !state.registration[f.key]; });
    if(missing.length){
      alertInline("فضلًا أكمل: " + missing.map(function(f){return f.label;}).join("، "));
      return;
    }
    state.registered = true;
    state.startedAt = state.startedAt || new Date().toISOString();
    CONTENT.chapters.forEach(function(c){ chState(c.id); });
    syncLocks();
    nav({name:"map"});
  });

  // map
  qsa(".medallion").forEach(function(btn){
    on(btn, "click", function(){
      var id = Number(btn.getAttribute("data-ch"));
      nav({name:"chapter", chId:id});
    });
  });
  on(qs("#btn-goto-completion"), "click", function(){ nav({name:"completion"}); });
  on(qs("#btn-goto-cert"), "click", function(){ nav({name:"certificate"}); });
  on(qs("#btn-back-map"), "click", function(){ nav({name:"map"}); });

  // chapter: story
  on(qs("#btn-story-next"), "click", function(){
    var cs = chState(state.route.chId); cs.stage="reading"; cs.readingIdx=0; saveState(); render();
  });

  // chapter: reading
  on(qs("#btn-read-next"), "click", function(){
    var c = chapterById(state.route.chId); var cs = chState(c.id);
    if(cs.readingIdx < c.reading.length-1){ cs.readingIdx++; }
    else { cs.stage="quiz"; cs.quizOrder=[]; cs.quizIdx=0; cs.answered={}; cs.wrongOnce={}; }
    saveState(); render();
  });
  on(qs("#btn-read-prev"), "click", function(){
    var cs = chState(state.route.chId); if(cs.readingIdx>0) cs.readingIdx--; saveState(); render();
  });

  // chapter: quiz choice
  qsa(".choice-btn").forEach(function(btn){
    on(btn, "click", function(){
      var c = chapterById(state.route.chId); var cs = chState(c.id);
      var remedial = cs.stage==="remedial";
      var qIndex = cs.quizOrder[cs.quizIdx];
      var q = c.quiz[qIndex];
      var chosen = Number(btn.getAttribute("data-idx"));
      cs.answered[qIndex] = chosen;
      if(chosen!==q.correct){
        cs.wrongOnce[qIndex] = true;
        if(q.danger) cs.dangerFlaggedEver = true;
      } else if(remedial){
        cs.wrongOnce[qIndex] = false;
      }
      saveState(); render();
    });
  });
  on(qs("#btn-quiz-prev"), "click", function(){
    var cs = chState(state.route.chId);
    if(cs.quizIdx > 0){ cs.quizIdx--; saveState(); render(); }
  });
  on(qs("#btn-quiz-next"), "click", function(){
    var c = chapterById(state.route.chId);
    var cs = chState(c.id);
    var qIndex = cs.quizOrder[cs.quizIdx];
    if(cs.answered[qIndex] === undefined) return;
    cs.quizIdx++;
    saveState();
    render();
  });

  // reflection
  qsa(".scale-opt").forEach(function(btn){
    on(btn, "click", function(){
      var cs = chState(state.route.chId);
      cs.reflectionAns[Number(btn.getAttribute("data-stmt"))] = Number(btn.getAttribute("data-val"));
      saveState(); render();
    });
  });
  on(qs("#btn-reflection-continue"), "click", function(){
    var cs = chState(state.route.chId); cs.stage="summary"; saveState(); render();
  });

  // plan (chapter 13)
  qsa(".plan-option").forEach(function(btn){
    on(btn, "click", function(){
      var cs = chState(state.route.chId);
      cs.planAns[Number(btn.getAttribute("data-topic"))] = Number(btn.getAttribute("data-opt"));
      saveState(); render();
    });
  });
  on(qs("#btn-plan-continue"), "click", function(){
    var cs = chState(state.route.chId); cs.stage="reflection"; saveState(); render();
  });

  // summary -> next
  on(qs("#btn-next-chapter"), "click", function(){
    var nextId = Number(qs("#btn-next-chapter").getAttribute("data-next"));
    syncLocks();
    nav({name:"chapter", chId:nextId});
  });

  // certificate
  on(qs("#btn-copy-cert"), "click", function(){
    var txt = state.certificateId;
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).catch(fallback);
    } else { fallback(); }
    var b = qs("#btn-copy-cert"); if(b){ var old=b.textContent; b.textContent="تم النسخ ✓"; setTimeout(function(){ b.textContent=old; },1500); }
  });
}

function alertInline(msg){
  var app = qs("#app");
  var existing = qs("#inline-alert");
  if(existing) existing.remove();
  var box = el('<div id="inline-alert" style="position:fixed;bottom:16px;left:16px;right:16px;max-width:400px;margin:0 auto;background:var(--danger-bg);border:1px solid var(--danger);color:var(--fg);padding:12px 16px;border-radius:10px;font-size:.9rem;z-index:50;box-shadow:var(--shadow);">'+esc(msg)+'</div>');
  app.appendChild(box);
  setTimeout(function(){ box.remove(); }, 3200);
}

/* ---------------------------------------------------------------- */
/* boot                                                               */
/* ---------------------------------------------------------------- */
function boot(){
  fetch("content.json").then(function(r){ return r.json(); }).then(function(data){
    CONTENT = data;
    if(state.registered){ syncLocks(); if(state.route.name==="intro") state.route={name:"map"}; }
    render();
  }).catch(function(err){
    qs("#app").innerHTML = '<div class="wrap"><div class="card"><h2 class="h-title">تعذر تحميل محتوى البرنامج</h2><p class="p">حدث خطأ أثناء تحميل بيانات الفصول. أعد تحميل الصفحة، فإن تكرر الخطأ فتواصل معنا.</p></div></div>';
  });
}
boot();
})();
</script>

</body></html>
